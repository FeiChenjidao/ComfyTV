<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ai Panel</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
  <uxp-panel panelid="com.comfytv.photoshop.panel">
    <span id="connection-state" class="connection-state">未连接</span>
    <main class="panel-shell">
      <section class="preview-stage" tabindex="-1">
        <div id="empty-preview" class="empty-preview">
          <img class="empty-image" src="preview-default.jpg" alt="">
        </div>
        <img id="preview" class="preview" alt="生成结果预览">
        <span id="preview-hit" class="preview-hit" role="button" tabindex="0"></span>

        <div id="history-hover" class="history-hover">
          <div id="history-hotspot" class="history-hotspot"></div>
          <div id="history-strip" class="history-strip"></div>
        </div>

        <nav class="tool-rail" aria-label="面板工具">
          <span id="settings-toggle" class="rail-btn" role="button" tabindex="0" title="设置">
            <span class="icon-slot" data-icon="settings-toggle"></span>
            <span class="btn-hit"></span>
          </span>
          <span id="web-toggle" class="rail-btn" role="button" tabindex="0" title="在 Photoshop 中打开 ComfyUI">
            <span class="icon-slot" data-icon="web-toggle"></span>
            <span class="btn-hit"></span>
          </span>
          <span id="fit-toggle" class="rail-btn" role="button" tabindex="0" title="切换预览适配">
            <span class="icon-slot" data-icon="fit-toggle"></span>
            <span class="btn-hit"></span>
          </span>
        </nav>

        <span id="history-toggle" class="rail-btn history-toggle" role="button" tabindex="0" title="历史记录">
          <span class="icon-slot" data-icon="history-toggle"></span>
          <span class="btn-hit"></span>
        </span>

        <section id="settings-drawer" class="drawer glass hidden">
          <div class="drawer-title">
            <strong>设置</strong>
            <button class="close-button" data-close="settings-drawer" type="button" title="关闭">&#215;</button>
          </div>
          <div class="field-row">
            <label for="server">ComfyUI 地址</label>
            <div class="server-row">
              <input id="server" value="http://127.0.0.1:8188" spellcheck="false">
              <button id="connect" type="button">连接</button>
            </div>
          </div>
          <div class="field-row">
            <label for="comfy-launch">启动程序</label>
            <div class="server-row">
              <input id="comfy-launch" spellcheck="false" placeholder="Comfy Desktop.exe">
              <button id="pick-comfy" type="button">选择</button>
            </div>
          </div>
          <button id="start-comfy" class="secondary-button" type="button">启动 ComfyUI</button>
          <div class="field-row">
            <label for="negative">负面提示词</label>
            <textarea id="negative" rows="3" placeholder="可选"></textarea>
          </div>
          <div class="field-row">
            <label for="max-res">更大则缩小</label>
            <input id="max-res" type="number" min="16" max="3840" step="16" value="1024">
          </div>
          <div class="field-row">
            <label for="min-res">更小则放大</label>
            <input id="min-res" type="number" min="16" max="3840" step="16" value="512">
          </div>
          <label class="check-row"><input id="crop-selection" type="checkbox" checked><span>有选区时裁切到选区</span></label>
          <div class="field-row">
            <label for="crop-pad">选区外扩 %</label>
            <input id="crop-pad" type="number" min="0" max="200" step="1" value="32" title="裁切时每边按选区尺寸的这个百分比向外扩，把周围一起传进去">
          </div>
          <div class="field-row">
            <label for="seed">种子</label>
            <div class="server-row">
              <input id="seed" type="number" min="0" max="2147483647" value="1379">
              <button id="randomize" type="button">随机</button>
            </div>
          </div>
          <label class="check-row"><input id="auto-seed" type="checkbox"><span>每次自动随机种子</span></label>
          <button id="send-layer" class="secondary-button" type="button">发送当前图层到 ComfyTV</button>
          <button id="add-layer" class="secondary-button" type="button" disabled>把结果添加为图层</button>
        </section>


        <div id="status-toast" class="status-toast glass hidden"></div>

        <section id="history-panel" class="history-panel hidden" aria-label="历史记录">
          <header class="history-panel-header">
            <div class="history-panel-title">
              <strong>历史记录</strong>
              <span id="history-panel-count">0 张</span>
            </div>
            <div class="history-panel-actions">
              <button id="history-panel-clear" class="history-panel-action danger" type="button">清空</button>
              <button id="history-panel-edit" class="history-panel-action" type="button">编辑</button>
              <button id="history-panel-close" class="close-button" type="button" title="关闭">&#215;</button>
            </div>
          </header>
          <div id="history-panel-grid" class="history-panel-grid"></div>
          <div id="history-panel-empty" class="history-panel-empty hidden">暂无生成记录</div>
          <footer class="history-panel-footer">
            <div class="history-panel-pagination">
              <button id="history-panel-prev" type="button">上一页</button>
              <span id="history-panel-page">1 / 1</span>
              <button id="history-panel-next" type="button">下一页</button>
            </div>
            <div id="history-panel-batch" class="history-panel-batch hidden">
              <span id="history-panel-selected-count">已选 0 张</span>
              <button id="history-panel-delete-selected" class="danger" type="button" disabled>删除所选</button>
              <button id="history-panel-edit-done" type="button">完成</button>
            </div>
          </footer>
        </section>

        <section id="history-limit" class="history-limit hidden">
          <div class="history-limit-title">
            <strong id="history-limit-text">生成图已有 380 张</strong>
            <button id="history-limit-close" class="close-button" type="button" title="关闭">&#215;</button>
          </div>
          <button id="history-clean" type="button">一键清理七天前图片</button>
          <button id="history-open-folder" type="button">打开文件夹</button>
          <p id="history-limit-note">只删除七天前的大图和对应缩略图，七天内的会留下。</p>
        </section>

        <div id="progress-frame" class="progress-frame" aria-hidden="true">
          <div id="pf-top" class="pf-edge"></div>
          <div id="pf-right" class="pf-edge"></div>
          <div id="pf-bottom" class="pf-edge"></div>
          <div id="pf-left" class="pf-edge"></div>
          <div id="pf-head" class="pf-head"></div>
        </div>

        <div id="host-popover-layer" class="host-popover-layer" aria-live="polite">
          <div id="model-menu" class="composer-menu host-model-menu hidden"></div>
          <div id="mode-menu" class="composer-menu mode-sheet host-mode-menu hidden"></div>
          <div id="count-menu" class="composer-menu composer-count-menu host-count-menu hidden"></div>
          <div id="preset-host-menu" class="host-preset-menu hidden"></div>
        </div>

        <footer id="composer" class="composer">
          <webview id="composer-webview" class="composer-webview" src="about:blank" tabindex="0"></webview>
          <div id="composer-legacy" class="composer-legacy">
            <div id="ref-row" class="composer-refs">
              <span id="ref-doc" class="ref-card" role="button" tabindex="0" title="生成时使用当前 Photoshop 画面">
                <span class="icon-slot" data-icon="ref-frame"></span>
                <span class="ref-card-label">画布</span>
              </span>
              <span id="ref-add" class="ref-card" title="从文件添加参考图">
                <span class="icon-slot" data-icon="ref-plus"></span>
                <span class="ref-card-label">添加</span>
                <button id="ref-add-btn" type="button" title="从文件添加参考图"></button>
              </span>
            </div>
            <div class="composer-prompt-row">
              <div id="mention-menu" class="mention-menu hidden"></div>
              <div id="prompt-tags" class="prompt-tags"></div>
              <textarea id="positive" class="composer-prompt" rows="2" placeholder="描述你想要生成的内容，输入 @ 引用参考图"></textarea>
              <div id="positive-mirror" class="composer-prompt-mirror" aria-hidden="true"></div>
            </div>
          </div>
          <div id="progress-label" class="composer-progress">就绪</div>
          <div class="composer-bar">
            <div class="composer-bar-left">
              <span id="model-trigger" class="composer-select" role="button" tabindex="0" title="模型">
                <span id="model-label">模型</span>
                <span class="icon-slot" data-icon="caret"></span>
              </span>
              <span id="mode-trigger" class="composer-select" role="button" tabindex="0" title="模式">
                <span id="mode-label">模式</span>
                <span class="icon-slot" data-icon="caret"></span>
              </span>
              <span id="crop-toggle" class="tiny-btn active" role="button" tabindex="0" title="有选区时裁切到选区">
                <span class="icon-slot" data-icon="crop-toggle"></span>
              </span>
              <span id="preset-open" class="tiny-btn" role="button" tabindex="0" title="预设">
                <span class="icon-slot" data-icon="preset-open"></span>
              </span>
            </div>
            <div class="composer-bar-right">
              <span id="count-trigger" class="composer-count" role="button" tabindex="0" title="生成数量。上一张回来后再生成下一张。">
                <span id="count-label">1x</span>
                <span class="icon-slot" data-icon="caret"></span>
              </span>
              <div class="generate-wrap">
                <span class="icon-slot generate-disk" data-icon="render-disk"></span>
                <span class="icon-slot" data-icon="render-up"></span>
                <button id="render" type="button" title="开始生成。右键会先换一个随机种子。生成过程中再点一次，停掉后面的。"></button>
              </div>
            </div>
          </div>
          <select id="workflow" class="composer-native">
            <option value="0" selected>NanoBanana</option>
            <option value="1">NanoBanana Pro</option>
            <option value="2">GPT</option>
          </select>
          <input id="batch-count" class="composer-native" type="number" min="1" max="8" step="1" value="1">
        </footer>
      </section>
    </main>
  </uxp-panel>
  <uxp-panel panelid="com.comfytv.photoshop.web">
    <div class="web-shell">
      <webview id="comfy-webview" src="about:blank"></webview>
    </div>
  </uxp-panel>
    <script src="icons.js"></script>
    <script src="glass.js"></script>
    <script src="preset-data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
